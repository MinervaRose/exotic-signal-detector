[project]
name = "exotic-signal-detector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "numpy>=1.26",
    "rich>=13",
    "matplotlib>=3.8",
]

[project.scripts]
exolab = "exolab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exolab"]

[dependency-groups]
dev = [
    "pytest>=8",
]
